<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <meta name="description" content="Get in touch for 2D/3D commissions, flyer designs, animation, toys, and graphic design work." />
        <link rel="stylesheet" href="styles.css">
        <title>Contact Me | Precious Hearts</title>
        <link rel="icon" href="Images/kitty.ico">
        <meta property="og:title" content="Contact Me | Precious Hearts">
        <meta property="og:description" content="Get in touch for 2D/3D commissions, flyer designs, animation, toys, and graphic design work.">
        <meta property="og:image" content="Images/kitty.ico">
        <meta property="og:type" content="website">
    </head>
    <body class="contact-body">
        <a href="index.html">
            <header>
                <img src="Images/heart1.png" alt="Prescious Hearts side heart" class="hearts">
                <img src="Images/logo2.png" alt="Prescious Hearts Logo" id="main_logo">
                <img src="Images/heart1.png" alt="Prescious Hearts side heart" class="hearts" id="heart-right">
            </header>
        </a>
        <main class="contact-main">
            <div class="bear-container">
                <img src="Images/bearJump.gif" alt="Plushie bear jumping up and down" class="bear-jump" loop="infinite">
               
            </div>
            <form class="contact-form" action="https://formspree.io/f/maenjpko" method="post">
                <h1 id="contact-text">Contact Form</h1>
                <input type="text" name="first" placeholder="First Name" autocomplete="off" required>
                <input type="text" name="last" placeholder="Last Name" autocomplete="off" required>
                <input type="email" name="email" placeholder="Email Address" autocomplete="off" required>
                <textarea rows="5" name="message" placeholder="Enter text" autocomplete="off" required></textarea>
                <button type="submit">Send Message</button>
                <p class="contact-p">Or just email <a href="mailto:priscilla.hatfield5@gmail.com">priscilla.hatfield5@gmail.com</a></p>
            </form>
        </main>
    </body>
</html>
